name: Build Wheels

on:
  push:
    branches: [ "*" ]
    tags: [ "py*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        working-directory: cython
        run: |
          python -m pip install -U pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-solvespace-sdist
          path: cython/dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: python-solvespace-sdist
          path: dist

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.17.0

      - name: Build wheels
        run: python -m cibuildwheel dist/*.tar.gz
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-solvespace-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'python-solvespace-*'
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
